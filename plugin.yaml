manifest_version: 2
name: repo-status
label: Repo Status
version: 0.6.0
kind: standalone
author: Peter Vesely
license: MIT
homepage: https://github.com/PeterVe/Hermes-Repo-Status
description: >
  Read-only overview of where and what Hermes works on: the git repository of
  a chat (remotes, git user, branch, server freshness via git ls-remote,
  uncommitted files), where Hermes wrote files, changes to Hermes settings,
  LLM provider calls, Honcho memory status, disk usage and environment
  variables. Hermes Desktop panel, /repo chat command, CLI
  `hermes repo-status` and agent tools. Speaks the Hermes UI languages
  (en, zh, zh-hant, ja, ar, ru, fr, de, es).
requires_hermes: ">=0.22.5"
tags: [git, github, gitlab, status, desktop, observability]
provides_tools:
  - repo_status
  - hermes_touched_paths
provides_hooks:
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_auxiliary_call
  - post_auxiliary_call
config_schema:
  export_dir:
    type: string
    default: ""
    label: Project export folder
    description: Empty disables export. Export writes only here; repositories remain read-only.
  export_include_secrets:
    type: bool
    default: false
    label: Include secret files in exports
    description: Sensitive! Includes .env files, credentials and private keys, including git history.
  export_include_scratch:
    type: bool
    default: false
    label: Include project scratch files
  export_scratch_cap_mb:
    type: int
    default: 500
    label: Maximum scratch content (MB)
  export_keep_last:
    type: int
    default: 0
    label: Keep newest project exports
    description: Zero never removes old exports. Positive values remove only this plugin's own project archives.
  check_remote:
    type: bool
    default: true
    label: Check the server
    description: Compare the branch with the server using git ls-remote (read-only, never fetch).
  branches_show_prs:
    type: bool
    default: true
    label: Open pull requests at server branches
    description: List open pull requests next to the server branches using the GitHub CLI (gh), when it is installed and signed in.
  remote_cache_seconds:
    type: int
    default: 60
    label: Server check cache (s)
    description: How long a server check result is reused before asking again.
  remote_timeout_seconds:
    type: int
    default: 8
    label: Server timeout (s)
  file_list_cap:
    type: int
    default: 200
    label: Max. files in a list
  host_kinds:
    type: dict
    default: {}
    label: Own git servers
    description: 'Hostname → kind, e.g. {"git.example.com": "forgejo"}. Kinds: github, gitlab, forgejo, bitbucket, azure, other.'
  work_dirs:
    type: list
    default: [".hermes/"]
    label: Hermes work folders inside a repo
    description: Uncommitted files in these folders (plans, sketches, notes) are shown apart and never count against "everything committed" or the status-bar chip.
  show_chip:
    type: bool
    default: true
    label: Status-bar chip (Desktop)
  track_writes:
    type: bool
    default: true
    label: Record where Hermes writes
    description: The post_tool_call hook stores paths from write_file, patch and MCP file tools plus terminal/execute_code commands (paths and a short command only, never content) in the shared ledger plugin-shared/repo-status/ledger.db.
  ledger_retention_days:
    type: int
    default: 90
    label: Keep records (days)
  llm_log:
    type: bool
    default: true
    label: Record LLM provider calls
    description: Metadata of every call (provider, model, session, tokens, timing, errors) in plugin-shared/repo-status/llm.db. Hermes always removes API keys before plugins see a call.
  llm_capture_content:
    type: bool
    default: false
    label: Also store call content (request/response)
    description: Sensitive and large - prompts carry the whole context including files read. Hermes caps the content (8,000 characters per string, 50,000 per call) and the plugin masks secrets. Kept briefly.
  llm_content_retention_days:
    type: int
    default: 7
    label: Keep call content (days)
